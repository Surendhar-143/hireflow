services:
  - type: web
    name: hireflow-backend
    runtime: node
    repo: https://github.com/Surendhar-143/hireflow
    branch: main
    buildCommand: pnpm install && pnpm run build --filter=@hireflow/express-api
    startCommand: pnpm --filter @hireflow/express-api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
