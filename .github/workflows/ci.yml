# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — runs on every pull request and push to main
# Jobs: lint → typecheck → build (with Turborepo remote cache)
# Optimization: node_modules artifact shared across jobs (eliminates 3× reinstalls)
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  NODE_VERSION: '20'
  PNPM_VERSION: '11'

jobs:
  # ── 1. Install & Cache ──────────────────────────────────────────────────────
  setup:
    name: 📦 Install dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Upload node_modules as artifact so downstream jobs don't reinstall
      - name: Cache node_modules for downstream jobs
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            node_modules
            frontend/web/node_modules
            backend/express-api/node_modules
            backend/fastapi-ai/.venv
            packages/**/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

  # ── 2. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore cached node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/web/node_modules
            backend/express-api/node_modules
            packages/**/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Lint — web
        run: pnpm --filter @hireflow/web lint

      - name: Lint — express-api
        run: pnpm --filter @hireflow/express-api lint --if-present

  # ── 3. Type Check ──────────────────────────────────────────────────────────
  typecheck:
    name: 🔎 Type check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore cached node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/web/node_modules
            backend/express-api/node_modules
            packages/**/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Type check — web
        run: pnpm --filter @hireflow/web exec tsc --noEmit

      - name: Type check — express-api
        run: pnpm --filter @hireflow/express-api exec tsc --noEmit

  # ── 4. Build ───────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore cached node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/web/node_modules
            backend/express-api/node_modules
            packages/**/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Build all apps (Turborepo)
        run: pnpm --filter @hireflow/web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8000/api' }}

      - name: Run unit tests (if any)
        run: pnpm test --if-present
        continue-on-error: false

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/web/dist
          retention-days: 7

  # ── 5. CI Success Gate ─────────────────────────────────────────────────────
  ci-success:
    name: ✅ CI passed
    needs: [lint, typecheck, build]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - run: echo "All CI checks passed!"
