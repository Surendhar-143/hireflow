[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@11.2.2", "pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @hireflow/schemas build",
  "cd backend/express-api && npx prisma generate && pnpm build"
]

[start]
cmd = "node backend/express-api/dist/server.js"
